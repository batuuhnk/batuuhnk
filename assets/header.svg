<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-label="Batuhan Kılıçlı — Embedded Software Engineer, Defense and Avionics">
<defs>
  <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse">
  <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#16213A" stroke-width="1"/></pattern>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="dial"><circle cx="960" cy="190" r="118"/></clipPath>
  <linearGradient id="fadeR" x1="0" x2="1"><stop offset="0" stop-color="#0A0F1C" stop-opacity="0"/><stop offset="1" stop-color="#0A0F1C"/></linearGradient>
  <style>
    .in{opacity:0;animation:in .8s ease-out forwards}
    .d1{animation-delay:.2s} .d2{animation-delay:.6s} .d3{animation-delay:1s} .d4{animation-delay:1.4s} .d5{animation-delay:1.8s}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
</defs>
<rect width="1200" height="380" rx="18" fill="#0A0F1C"/>
<rect width="1200" height="380" rx="18" fill="url(#g)" opacity=".6"/>
<rect x="1" y="1" width="1198" height="378" rx="17" fill="none" stroke="#1E293B" stroke-width="2"/>

<!-- corner registration marks -->
